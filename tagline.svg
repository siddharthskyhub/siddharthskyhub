<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 50" width="100%" height="100%">
  <defs>
    <clipPath id="taglineClip">
      <rect class="type-mask" x="207" y="0" width="0" height="50" />
    </clipPath>
    <style>
      .font-mono {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'Courier New', monospace;
      }
      @keyframes typeTyping {
        0% { width: 0; }
        42% { width: 476px; }
        78% { width: 476px; }
        92% { width: 0; }
        100% { width: 0; }
      }
      @keyframes cursorTranslate {
        0% { transform: translateX(0); }
        42% { transform: translateX(468px); }
        78% { transform: translateX(468px); }
        92% { transform: translateX(0); }
        100% { transform: translateX(0); }
      }
      @keyframes cursorBlink {
        0%, 48% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .type-mask {
        animation: typeTyping 9s steps(43, end) infinite;
      }
      .cursor-tracker {
        animation: cursorTranslate 9s steps(43, end) infinite;
      }
      .cursor-bar {
        animation: cursorBlink 0.75s infinite;
      }
    </style>
  </defs>

  <g clip-path="url(#taglineClip)">
    <text class="font-mono" x="440" y="32" text-anchor="middle"
          font-size="19" font-weight="600" fill="#FF758F" letter-spacing="0.5"
          filter="drop-shadow(0 0 10px #FF758F55)">
      Turning coffee and chai into clean code
    </text>
  </g>

  <g transform="translate(207, 0)">
    <g class="cursor-tracker">
      <rect class="cursor-bar" x="0" y="16" width="2.8" height="20" rx="1.4" fill="#FF758F" />
    </g>
  </g>
</svg>